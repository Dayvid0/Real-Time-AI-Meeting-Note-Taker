<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Meeting Notes AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7a1c"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Note / document -->
  <rect x="136" y="112" width="240" height="288" rx="28" fill="#ffffff"/>

  <!-- Text lines -->
  <rect x="176" y="168" width="160" height="22" rx="11" fill="#1f7a1c" opacity="0.85"/>
  <rect x="176" y="216" width="120" height="22" rx="11" fill="#1f7a1c" opacity="0.6"/>
  <rect x="176" y="264" width="148" height="22" rx="11" fill="#1f7a1c" opacity="0.4"/>

  <!-- Audio waveform -->
  <g fill="#2ea043">
    <rect x="176" y="330" width="16" height="38" rx="8"/>
    <rect x="206" y="312" width="16" height="74" rx="8"/>
    <rect x="236" y="340" width="16" height="18" rx="8"/>
    <rect x="266" y="304" width="16" height="90" rx="8"/>
    <rect x="296" y="326" width="16" height="46" rx="8"/>
    <rect x="326" y="336" width="16" height="26" rx="8"/>
  </g>
</svg>
