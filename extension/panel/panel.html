<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Notes AI - Panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="panel">
    <div class="header">
      <h1 id="meetingTitle">Meeting Notes AI</h1>
      <div class="status-dot" id="statusDot" title="Disconnected"></div>
    </div>

    <div class="timer" id="liveTimer" style="display:none;">--:--</div>

    <div class="controls">
      <button class="btn-end" id="endMeetingBtn">End Meeting</button>
    </div>

    <div class="transcript-container">
      <div class="transcript-area" id="transcriptArea" tabindex="0" aria-label="Live transcript">
        <div class="no-transcript">Waiting for transcript...</div>
      </div>
    </div>

    <div class="summary-container" id="summaryContainer">
      <button class="summary-toggle" id="summaryToggle" aria-label="Toggle summary">
        Summary <span class="arrow">▼</span>
      </button>
      <div class="summary-content" id="summaryContent" class="summary-content empty">No summary yet</div>
    </div>

    <div class="controls-summary">
      <button class="btn-collapse" id="collapseBtn" aria-label="Collapse summary">Hide summary</button>
    </div>

    <div class="history-section" id="historySection">
      <h3>Meeting History</h3>
      <div class="history-list" id="historyList">
        <div class="history-item empty">No meetings recorded</div>
      </div>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
