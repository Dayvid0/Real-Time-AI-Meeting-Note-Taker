<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Notes AI Offscreen</title>
</head>
<body>
  <script type="module">
    import { createLogger } from './logger.js';

    const log = createLogger('offscreen');

    // Offscreen document for audio capture. Receives a "start-capture" message
    // from the background worker with a tab-capture streamId, then mixes the
    // tab audio ("others") and microphone ("you") into PCM16 frames.

    let audioContext = null;
    let isRecording = false;
    let currentStreamId = '';
    let tabStream = null;
    let micStream = null;
    let tabWorklet = null;
    let micWorklet = null;

    chrome.runtime.onMessage.addListener((message, _sender, sendResponse) => {
      if (message.type === 'start-capture') {
        currentStreamId = message.streamId;
        initAudioCapture();
        sendResponse({ success: true });
      }
      if (message.type === 'stop-capture') {
        tearDownCapture();
        sendResponse({ success: true });
      }
      return false;
    });

    function tabAudioConstraints(streamId) {
      return {
        audio: {
          mandatory: {
            chromeMediaSource: 'tab',
            chromeMediaSourceId: streamId,
          },
        },
        video: false,
      };
    }

    async function initAudioCapture() {
      if (isRecording) return;
      isRecording = true;

      try {
        tabStream = await navigator.mediaDevices.getUserMedia(
          tabAudioConstraints(currentStreamId),
        );
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false,
        });

        audioContext = new AudioContext({ sampleRate: 16000 });
        await audioContext.audioWorklet.addModule('/worklet.js');

        // One worklet node per source so channels stay identifiable.
        tabWorklet = new AudioWorkletNode(audioContext, 'pcm-processor');
        micWorklet = new AudioWorkletNode(audioContext, 'pcm-processor');
        tabWorklet.port.postMessage({ sourceType: 'others' });
        micWorklet.port.postMessage({ sourceType: 'you' });

        tabWorklet.port.onmessage = (event) => forwardFrame('others', event.data);
        micWorklet.port.onmessage = (event) => forwardFrame('you', event.data);

        const tabTrack = tabStream.getAudioTracks()[0];
        if (tabTrack) {
          audioContext.createMediaStreamSource(new MediaStream([tabTrack])).connect(tabWorklet);
        }
        const micTrack = micStream.getAudioTracks()[0];
        if (micTrack) {
          audioContext.createMediaStreamSource(new MediaStream([micTrack])).connect(micWorklet);
        }

        // Route through a silent gain node so the processors run without
        // playing the captured audio back out of the speakers.
        const mute = audioContext.createGain();
        mute.gain.value = 0;
        tabWorklet.connect(mute);
        micWorklet.connect(mute);
        mute.connect(audioContext.destination);

        chrome.runtime.sendMessage({ type: 'capture_started' });
      } catch (err) {
        log.error('Failed to initialise audio capture', err);
        tearDownCapture();
      }
    }

    function forwardFrame(source, payload) {
      chrome.runtime.sendMessage({
        type: 'pcm-frame',
        source,
        sampleRate: payload.sampleRate,
        data: payload.data,
      });
    }

    function tearDownCapture() {
      isRecording = false;

      if (tabWorklet) {
        try { tabWorklet.disconnect(); } catch (e) { /* already disconnected */ }
        tabWorklet = null;
      }
      if (micWorklet) {
        try { micWorklet.disconnect(); } catch (e) { /* already disconnected */ }
        micWorklet = null;
      }

      if (tabStream) {
        tabStream.getTracks().forEach((t) => t.stop());
        tabStream = null;
      }
      if (micStream) {
        micStream.getTracks().forEach((t) => t.stop());
        micStream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      currentStreamId = '';
      chrome.runtime.sendMessage({ type: 'capture_stopped' });
    }
  </script>
</body>
</html>
