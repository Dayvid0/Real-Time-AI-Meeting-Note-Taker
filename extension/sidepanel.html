<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Notes AI</title>
  <style>
    body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #333; }
    h1 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    .status { padding: 8px 12px; border-radius: 12px; margin-bottom: 20px; font-size: 0.85rem; }
    .recording { background: #ffebee; color: #c62828; }
    .idle { background: #e8f5e9; color: #2e7d32; }
    .transcript { height: 300px; overflow-y: auto; background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 15px; font-size: 0.85rem; line-height: 1.4; }
    .summary { height: 150px; overflow-y: auto; background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 15px; font-size: 0.85rem; }
    .notes { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
    .history { margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
    button { padding: 8px 16px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    button:disabled { background: #b0bec5; cursor: not-allowed; }
    .btn-start { background: #2e7d32; }
    .btn-stop { background: #c62828; }
    .btn-summary { background: #1976d2; }
  </style>
</head>
<body>
  <h1>Meeting Notes AI</h1>
  <div class="status idle" id="status">Idle</div>
  
  <div class="transcript" id="transcript">Waiting for transcript...</div>
  <div class="summary" id="summary" style="display:none;">Summary will appear here...</div>
  <div class="notes" id="notes" style="display:none;">
    <h3>Final Notes</h3>
    <div id="finalNotes">No meeting finalized yet</div>
  </div>
  
  <button class="btn-start" id="startBtn">Start Meeting</button>
  <button class="btn-stop" id="stopBtn" disabled>Stop Meeting</button>
  <button class="btn-summary" id="summaryBtn" disabled>Generate Summary</button>
  
  <div class="history" id="history">Meeting history will appear here</div>

  <script>
    // Side panel - handles UI updates from background
    let meetingId = '';
    let isMeetingActive = false;

    // Update status
    function updateStatus(status: string) {
      const el = document.getElementById('status') as HTMLElement;
      el.className = `status ${status}`;
      el.textContent = status.charAt(0).toUpperCase() + status.slice(1);
    }

    // Add transcript line
    function addTranscript(line: string, speaker: 'you' | 'others') {
      const el = document.getElementById('transcript') as HTMLElement;
      const className = speaker === 'you' ? 'you' : 'others';
      const div = document.createElement('div');
      div.className = className;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${line}`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    // Show summary
    function showSummary(summary: any) {
      const el = document.getElementById('summary') as HTMLElement;
      el.style.display = 'block';
      el.innerHTML = `<strong>Summary:</strong> ${summary.summary || 'Generating...'}`;
    }

    // Show final notes
    function showNotes(title: string, points: string[]) {
      const el = document.getElementById('notes') as HTMLElement;
      el.style.display = 'block';
      const notesEl = document.getElementById('finalNotes') as HTMLElement;
      notesEl.innerHTML = `<strong>${title}</strong><ul>${points.map(p => `<li>${p}</li>`).join('')}</ul>`;
    }

    // Load meeting history
    function loadHistory(meetings: any[]) {
      const el = document.getElementById('history') as HTMLElement;
      if (meetings.length === 0) {
        el.innerHTML = 'No meetings recorded';
        return;
      }
      let html = '<ul>';
      meetings.slice(-10).forEach(m => {
        html += `<li>${m.title} - ${m.duration.toFixed(1)}min - ${new Date(m.startTime).toLocaleString()}</li>`;
      });
      html += '</ul>';
      el.innerHTML = html;
    }

    // Listen for messages from background
    chrome.runtime.onMessage.addListener((message: any, sender, sendResponse: any) => {
      if (message.type === 'status_update') {
        updateStatus(message.status);
      }
      if (message.type === 'transcript') {
        addTranscript(message.text, message.speaker);
      }
      if (message.type === 'summary') {
        showSummary(message.summary);
      }
      if (message.type === 'final_notes') {
        showNotes(message.title, message.keyPoints);
      }
      if (message.type === 'meeting_history') {
        loadHistory(message.meetings);
      }
      if (message.type === 'meeting_active') {
        isMeetingActive = message.active;
        document.getElementById('startBtn')!.disabled = message.active;
        document.getElementById('stopBtn')!.disabled = !message.active;
        document.getElementById('summaryBtn')!.disabled = !message.active;
      }
      if (message.type === 'meeting_id') {
        meetingId = message.id;
      }
      return true;
    });

    // Button handlers
    document.getElementById('startBtn')!.addEventListener('click', () => {
      chrome.runtime.sendMessage({ type: 'start_meeting' });
    });

    document.getElementById('stopBtn')!.addEventListener('click', () => {
      chrome.runtime.sendMessage({ type: 'stop_meeting' });
    });

    document.getElementById('summaryBtn')!.addEventListener('click', () => {
      chrome.runtime.sendMessage({ type: 'generate_summary' });
    });
  </script>
</body>
</html>
