# fly.io deployment for the Meeting Notes AI backend.
#
# Env vars:
#   Non-secret config lives in [env] below.
#   Secrets must be set out-of-band (they are NOT stored in this file):
#     fly secrets set JWT_SECRET=... DEEPGRAM_API_KEY=... OPENAI_API_KEY=...
#
# WebSocket note: the app is kept warm (min_machines_running = 1) so long-lived
# transcription sockets are not interrupted by autoscaling.

app = "meeting-notes-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  OPENAI_MODEL = "gpt-4o-mini"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
