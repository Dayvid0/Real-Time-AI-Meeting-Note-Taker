name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: python -m pip install -r server/requirements-dev.txt
      - run: npm ci
        working-directory: extension
      - run: ruff check app tests benchmarks
        working-directory: server
      - run: ruff format --check app tests benchmarks
        working-directory: server
      - run: python -m unittest discover -s tests -v
        working-directory: server
      - run: npm run check
        working-directory: extension
      - run: npm run lint
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: RELAY_URL=https://relay.example.invalid npm run build
        working-directory: extension
      - run: npm run package
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-notes-extension
          path: extension/meeting-notes-extension.zip
      - run: docker build -f server/Dockerfile -t meeting-notes-relay:ci .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app "$FLY_APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
